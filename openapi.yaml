openapi: 3.0.3
info:
  title: Laravel API v2
  description: >-
    API REST v2 pour l'authentification (Sanctum + Refresh Tokens avec
    rotation), la gestion de profil, les appareils connectés et la détection /
    sélection de la langue et du pays.


    ### Principes Clés

    - **Headers indispensables** : Toutes les requêtes doivent spécifier
    `Accept: application/json`.

    - **Langue & Pays** : `X-Locale-Override` (ex: `fr`, `en`) est
    recommandé sur toutes les requêtes pour forcer la langue souhaitée sans
    modifier le profil utilisateur.

    - **Gestion des Tokens** : Access token Sanctum (`expires_in`) + Refresh
    token maison (`refresh_expires_in`) avec rotation atomique et détection de
    réutilisation frauduleuse. Les durées exactes sont fournies dans chaque
    réponse d'authentification.

    - **Format d'Erreur Unifié** : Toutes les erreurs 4xx retournent un code
    machine stable `code` (snake_case) et un message lisible `message`.
  version: 2.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Proprietary
    url: https://opensource.org/licenses
servers:
  - url: /api/v2
    description: API v2 Base URL (relative)
tags:
  - name: Authentication
    description: >-
      Inscription, connexion 2FA, mot de passe oublié, renvoi de code OTP et
      refresh token
  - name: Profile
    description: >-
      Consultation, modification du profil, validation de changement d'email,
      mot de passe et suppression de compte
  - name: Devices
    description: Gestion des sessions actives et des appareils connectés (family_id stable)
  - name: Locale
    description: >-
      Consultation du contexte de localisation et mise à jour des préférences
      utilisateur
  - name: Countries
    description: Liste des pays actifs disponibles pour sélection
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Jeton d'accès personnel Sanctum (format `Bearer {access_token}`)
  parameters:
    XLocaleOverride:
      name: X-Locale-Override
      in: header
      description: >-
        Code de langue prioritaire pour surcharger la langue de réponse sans
        persister en base (ex: `fr`, `en`)
      required: false
      schema:
        type: string
        example: fr
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: 'Préférences linguistiques du client HTTP (ex: `fr,en;q=0.9`)'
      required: false
      schema:
        type: string
        example: fr-FR,fr;q=0.9,en;q=0.8
  headers:
    ContentLanguage:
      description: Code de langue de la réponse (Content-Language)
      schema:
        type: string
        example: fr
    Vary:
      description: 'Directives de mise en cache (Vary: Accept-Language, X-Locale-Override, Authorization)'
      schema:
        type: string
        example: 'Accept-Language, X-Locale-Override, Authorization'
  responses:
    UnauthorizedError:
      description: Authentification manquante, invalide ou expirée
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unauthenticated
            message: Unauthenticated.
    DeviceNotFoundError:
      description: Appareil ou session introuvable (existe plus ou appartient à un autre utilisateur)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: device_not_found
            message: The device session was not found.
    TooManyRequestsError:
      description: Quota de requêtes dépassé (limiteur de débit)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
        Retry-After:
          schema:
            type: integer
            example: 60
          description: Nombre de secondes à attendre avant de pouvoir réessayer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
          example:
            code: too_many_requests
            message: Too many attempts. Please try again later.
            retry_after: 60
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unauthenticated
            - resource_not_found
            - too_many_requests
            - validation_failed
            - password_current_incorrect
            - credentials_invalid
            - pending_email_verification_required
            - invalid_token
            - otp_invalid
            - otp_expired
            - otp_max_attempts
            - device_not_found
            - invalid_refresh_token
            - refresh_token_expired
          description: Identifiant machine stable de l'erreur en snake_case
          example: unauthenticated
        message:
          type: string
          description: Message informatif lisible pour l'humain
          example: Unauthenticated.
    ValidationErrorResponse:
      type: object
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - password_current_incorrect
            - credentials_invalid
            - invalid_token
            - otp_invalid
            - otp_expired
            - otp_max_attempts
            - invalid_refresh_token
            - refresh_token_expired
          example: validation_failed
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.
            code:
              - The verification code is invalid.
    RateLimitErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - too_many_requests
          example: too_many_requests
        message:
          type: string
          example: Too many attempts. Please try again later.
        retry_after:
          type: integer
          nullable: true
          description: Secondes restantes avant déblocage
          example: 60
    Language:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: fr
        name:
          type: string
          example: French
    LanguageWithSource:
      type: object
      nullable: true
      required:
        - id
        - code
        - name
        - source
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: fr
        name:
          type: string
          example: French
        source:
          type: string
          enum:
            - override
            - profile
            - accept_language
            - country
            - default
          description: Origine de la résolution de la langue
          example: profile
    Country:
      type: object
      required:
        - id
        - code
        - name
        - phone_code
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: BF
        name:
          type: string
          example: Burkina Faso
        native_name:
          type: string
          example: Burkina Faso
        phone_code:
          type: string
          example: '+226'
        language:
          $ref: '#/components/schemas/Language'
    CountryDetail:
      type: object
      nullable: true
      required:
        - id
        - code
        - name
        - phone_code
        - is_active
        - source
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: BF
        name:
          type: string
          example: Burkina Faso
        native_name:
          type: string
          example: Burkina Faso
        phone_code:
          type: string
          example: '+226'
        is_active:
          type: boolean
          example: true
        source:
          type: string
          enum:
            - profile
            - single_active
          example: profile
        language:
          $ref: '#/components/schemas/Language'
    User:
      type: object
      required:
        - id
        - first_name
        - last_name
        - email
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Dupont
        full_name:
          type: string
          example: Alice Dupont
        email:
          type: string
          format: email
          example: alice@example.com
        pending_email:
          type: string
          format: email
          nullable: true
          example: null
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-09T23:49:56.000000Z'
        language_id:
          type: integer
          nullable: true
          example: 1
        language:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Language'
        country_id:
          type: integer
          nullable: true
          example: 1
        country:
          nullable: true
          type: object
          properties:
            id:
              type: integer
              example: 1
            code:
              type: string
              example: BF
            name:
              type: string
              example: Burkina Faso
            phone_code:
              type: string
              example: '+226'
            is_active:
              type: boolean
              example: true
        created_at:
          type: string
          format: date-time
          example: '2026-10-09T23:49:56.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-09T23:49:56.000000Z'
    AuthTokenResponse:
      type: object
      required:
        - message
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
        - user
      properties:
        message:
          type: string
          description: >-
            Message de succès propre à l'endpoint (inscription, connexion,
            rafraîchissement)
        access_token:
          type: string
          description: Jeton d'accès Sanctum
          example: 2|abc...
        refresh_token:
          type: string
          description: Jeton de rafraîchissement à usage unique
          example: r9T5nvAXjazh79xbahsv6aQUD02Z4ylwvIAi908c72a1...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Durée de validité de l'access token en secondes (86400 = 24h = 1440 min)
          example: 86400
        refresh_expires_in:
          type: integer
          description: Durée de validité du refresh token en secondes (2592000 = 30 jours)
          example: 2592000
        user:
          $ref: '#/components/schemas/User'
    Device:
      type: object
      required:
        - id
        - name
        - is_current
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant stable de session (family_id)
          example: 36a237e6-0023-44f4-8e78-b852be2b4594
        name:
          type: string
          description: Nom de l'appareil
          example: iPhone 15
        is_current:
          type: boolean
          description: Indique s'il s'agit de la session de la requête courante
          example: false
        last_used_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-09T23:49:56.000000Z'
        created_at:
          type: string
          format: date-time
          example: '2026-10-09T23:49:56.000000Z'
    LocaleContext:
      type: object
      required:
        - language
        - country
        - country_selection_required
        - preferences
        - supported_languages
        - countries
      properties:
        language:
          $ref: '#/components/schemas/LanguageWithSource'
        country:
          $ref: '#/components/schemas/CountryDetail'
        country_selection_required:
          type: boolean
          description: >-
            Vaut true quand au moins un pays est actif et qu'aucun pays actif
            n'est résolu (aucun choix, ou pays du profil devenu inactif)
          example: false
        preferences:
          type: object
          properties:
            language_id:
              type: integer
              nullable: true
              example: 1
            country_id:
              type: integer
              nullable: true
              example: 1
        supported_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
paths:
  /auth/register/send-code:
    post:
      tags:
        - Authentication
      operationId: sendRegisterOtp
      summary: Envoyer un code OTP d'inscription
      description: >-
        Initie le flux d'inscription en transmettant un code à 6 chiffres par
        email.


        **Limite de débit :** `otp-send` (1/min, 5/h par IP/email).

        **Anti-énumération :** Même réponse HTTP 200 si le compte existe déjà.
      security: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@example.com
      responses:
        '200':
          description: Code de vérification envoyé avec succès
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - email
                  - expires_in
                  - resend_available_in
                properties:
                  message:
                    type: string
                    example: A verification code has been sent to your email address.
                  email:
                    type: string
                    example: newuser@example.com
                  expires_in:
                    type: integer
                    example: 600
                    description: Validité du code OTP en secondes (10 min)
                  resend_available_in:
                    type: integer
                    example: 60
                    description: Temps d'attente avant renvoi possible en secondes
        '422':
          description: Données invalides (email requis, format).
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                code: validation_failed
                message: The email field is required.
                errors:
                  email:
                    - The email field is required.
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /auth/register/resend-code:
    post:
      tags:
        - Authentication
      operationId: resendRegisterOtp
      summary: Renvoyer le code OTP d'inscription
      description: >-
        Renvoie un code OTP d'inscription frais après expiration du cooldown de
        60 secondes.


        **Limite de débit :** `otp-send` (1/min, 5/h).
      security: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@example.com
      responses:
        '200':
          description: Nouveau code envoyé
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - email
                  - expires_in
                  - resend_available_in
                properties:
                  message:
                    type: string
                    example: A verification code has been sent to your email address.
                  email:
                    type: string
                    example: newuser@example.com
                  expires_in:
                    type: integer
                    example: 600
                  resend_available_in:
                    type: integer
                    example: 60
        '422':
          description: Données invalides (email requis).
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                code: validation_failed
                message: The email field is required.
                errors:
                  email:
                    - The email field is required.
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /auth/register/verify-code:
    post:
      tags:
        - Authentication
      operationId: verifyRegisterOtp
      summary: Vérifier le code OTP d'inscription
      description: >-
        Valide le code OTP à 6 chiffres et émet un `verification_token`
        temporaire d'une durée de 15 minutes.


        **Limite de débit :** `otp-verify` (5/min).
      security: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@example.com
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '123456'
      responses:
        '200':
          description: Code vérifié et jeton émis
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - verification_token
                  - email
                  - expires_in
                properties:
                  message:
                    type: string
                    example: Verification code confirmed.
                  verification_token:
                    type: string
                    example: FIb4ZndtXbk7Ss7cmJydENkvsTM9pQWFjl4EFE9a5MMOhmONQphFr79NiM9sRZUr
                  email:
                    type: string
                    example: newuser@example.com
                  expires_in:
                    type: integer
                    example: 900
                    description: Durée de vie du verification_token en secondes (15 min)
        '422':
          description: >-
            Code OTP invalide, expiré ou nombre maximal de tentatives atteint. Codes possibles : otp_invalid, otp_expired, otp_max_attempts, validation_failed.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                otp_invalid:
                  summary: Code OTP invalide
                  value:
                    code: otp_invalid
                    message: The verification code is invalid.
                    errors:
                      code:
                        - The verification code is invalid.
                otp_expired:
                  summary: Code OTP expiré
                  value:
                    code: otp_expired
                    message: The verification code has expired.
                    errors:
                      code:
                        - The verification code has expired.
                otp_max_attempts:
                  summary: Nombre maximal de tentatives atteint
                  value:
                    code: otp_max_attempts
                    message: Too many verification attempts. Please request a new code.
                    errors:
                      code:
                        - Too many verification attempts. Please request a new code.
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /auth/register/complete:
    post:
      tags:
        - Authentication
      operationId: completeRegistration
      summary: Finaliser la création de compte
      description: >-
        Crée l'utilisateur avec son mot de passe et préférences, consomme le
        `verification_token` et émet la première paire de jetons
        d'authentification.


        **Limite de débit :** `otp-verify` (5/min).
      security: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verification_token
                - first_name
                - last_name
                - password
                - password_confirmation
              properties:
                verification_token:
                  type: string
                  example: FIb4ZndtXbk7Ss7cmJydENkvsTM9pQWFjl4EFE9a5MMOhmONQphFr79NiM9sRZUr
                first_name:
                  type: string
                  maxLength: 255
                  example: Alice
                last_name:
                  type: string
                  maxLength: 255
                  example: Dupont
                password:
                  type: string
                  minLength: 8
                  example: Password123!
                password_confirmation:
                  type: string
                  minLength: 8
                  example: Password123!
                country_id:
                  type: integer
                  nullable: true
                  example: 1
                  description: Requis s'il existe plus d'un pays actif en base
                language_id:
                  type: integer
                  nullable: true
                  example: 1
                device_name:
                  type: string
                  nullable: true
                  example: iPhone 15
      responses:
        '201':
          description: Compte créé et session démarrée
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                message: Your account has been registered successfully.
                access_token: 2|abc...
                refresh_token: r9T5nvAXjazh79xbahsv6aQUD02Z4ylwvIAi908c72a1...
                token_type: Bearer
                expires_in: 86400
                refresh_expires_in: 2592000
                user:
                  id: 1
                  first_name: Alice
                  last_name: Dupont
                  full_name: Alice Dupont
                  email: alice@example.com
                  pending_email: null
                  email_verified_at: '2026-10-09T23:49:56.000000Z'
                  language_id: 1
                  language:
                    id: 1
                    code: fr
                    name: French
                  country_id: 1
                  country:
                    id: 1
                    code: BF
                    name: Burkina Faso
                    phone_code: '+226'
                    is_active: true
                  created_at: '2026-10-09T23:49:56.000000Z'
                  updated_at: '2026-10-09T23:49:56.000000Z'
        '422':
          description: >-
            Jeton de vérification invalide ou expiré. Codes possibles : invalid_token, validation_failed.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                code: invalid_token
                message: The verification token is invalid or has expired.
                errors:
                  verification_token:
                    - The verification token is invalid or has expired.
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginWithCredentials
      summary: Étape 1 de connexion (2FA)
      description: >-
        Vérifie les identifiants et envoie un code OTP à 6 chiffres par email
        pour la validation à double facteur.


        **Limite de débit :** `login` (5/min, 20/min/IP).
      security: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Identifiants validés, saisie 2FA requise
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - challenge_token
                  - email
                  - expires_in
                  - resend_available_in
                properties:
                  message:
                    type: string
                    example: >-
                      Credentials verified. Please enter the verification code
                      sent to your email.
                  challenge_token:
                    type: string
                    example: c7a8b9e0f1...
                  email:
                    type: string
                    example: alice@example.com
                  expires_in:
                    type: integer
                    example: 600
                  resend_available_in:
                    type: integer
                    example: 60
        '403':
          description: Vérification de nouvel email en attente
          headers:
