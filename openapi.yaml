    patch:
      tags:
        - Locale
      operationId: updateLocalePreferences
      summary: Mettre à jour les préférences de langue/pays
      description: >-
        Modifie les préférences de langue et/ou de pays enregistrées dans le
        profil utilisateur. C'est le seul point d'écriture des préférences
        (retiré de `PUT /auth/profile`).


        **Règles :**

        - Au moins une des clés `language_id`, `country_id` ou `reset_to_auto`
        doit être fournie.

        - `reset_to_auto: true` est exclusif : il ne peut pas être combiné avec
        `country_id` ou `language_id` non nuls.

        - Un `null` explicite remet le champ correspondant en détection
        automatique.

        - Un pays (`country_id`) ou une langue (`language_id`) inactif est
        refusé.


        **Limite de débit :** `auth-api` (60/min).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleOverride'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                language_id:
                  type: integer
                  nullable: true
                  example: 1
                  description: >-
                    ID d'une langue active, ou null pour revenir à la détection
                    automatique
                country_id:
                  type: integer
                  nullable: true
                  example: 1
                  description: >-
                    ID d'un pays actif, ou null pour revenir à la détection
                    automatique
                reset_to_auto:
                  type: boolean
                  example: false
                  description: >-
                    Réinitialise simultanément langue et pays en détection
                    automatique (interdit avec country_id/language_id non nuls)
      responses:
        '200':
          description: Préférences mises à jour
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - locale
                  - user
                properties:
                  message:
                    type: string
                    example: Locale preferences updated successfully.
                  locale:
                    $ref: '#/components/schemas/LocaleContext'
                  user:
                    $ref: '#/components/schemas/User'
              example:
                message: Locale preferences updated successfully.
                locale:
                  language:
                    id: 1
                    code: fr
                    name: French
                    source: profile
                  country:
                    id: 1
                    code: BF
                    name: Burkina Faso
                    native_name: Burkina Faso
                    phone_code: '+226'
                    is_active: true
                    source: profile
                    language:
                      id: 1
                      code: fr
                      name: French
                  country_selection_required: false
                  preferences:
                    language_id: 1
                    country_id: 1
                  supported_languages:
                    - id: 1
                      code: fr
                      name: French
                    - id: 2
                      code: en
                      name: English
                  countries:
                    - id: 1
                      code: BF
                      name: Burkina Faso
                      native_name: Burkina Faso
                      phone_code: '+226'
                      language:
                        id: 1
                        code: fr
                        name: French
                user:
                  id: 1
                  first_name: Alice
                  last_name: Dupont
                  full_name: Alice Dupont
                  email: alice@example.com
                  pending_email: null
                  email_verified_at: '2026-10-09T23:49:56.000000Z'
                  language_id: 1
                  language:
                    id: 1
                    code: fr
                    name: French
                  country_id: 1
                  country:
                    id: 1
                    code: BF
                    name: Burkina Faso
                    phone_code: '+226'
                    is_active: true
                  created_at: '2026-10-09T23:49:56.000000Z'
                  updated_at: '2026-10-10T10:05:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: >-
            Règles violées ou valeurs invalides. Codes possibles :
            validation_failed avec les erreurs `fields`, `reset_to_auto`,
