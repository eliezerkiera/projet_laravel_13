                    code: validation_failed
                    message: At least one of country_id, language_id or reset_to_auto must be provided.
                    errors:
                      fields:
                        - At least one of country_id, language_id or reset_to_auto must be provided.
                reset_to_auto_conflict:
                  summary: reset_to_auto combiné à une autre clé
                  value:
                    code: validation_failed
                    message: reset_to_auto cannot be combined with country_id or language_id.
                    errors:
                      reset_to_auto:
                        - reset_to_auto cannot be combined with country_id or language_id.
                country_not_available:
